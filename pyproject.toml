[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-dast"
version = "0.5.0"
description = "YAML data-structure templates: render YAML into concrete Python data using structured template tags."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "ydst contributors"},
]
keywords = [
  "yaml",
  "template",
  "templating",
  "data-structure",
  "configuration",
  "config",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.0",
  "pyright>=1.1",
  "ruff>=0.1.0",
  "click>=8.0",  # for commit-helper script
  "types-PyYAML>=6.0",  # type stubs for mypy
]

[project.urls]
Homepage = "https://github.com/mandersogit/yaml-dast"
Repository = "https://github.com/mandersogit/yaml-dast"
Documentation = "https://github.com/mandersogit/yaml-dast/tree/main/docs"
Issues = "https://github.com/mandersogit/yaml-dast/issues"

[project.scripts]
ydst = "ydst.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ydst*"]

[tool.setuptools.package-data]
ydst = ["py.typed"]

[tool.mypy]
# Strict mode for better type safety
strict = false
ignore_missing_imports = true

[tool.pyright]
include = ["ydst"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingModuleSource = false  # PyYAML has no source
